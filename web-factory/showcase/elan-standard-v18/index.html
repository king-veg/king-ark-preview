<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ÉLAN STANDARD v18</title><style>
*{box-sizing:border-box}:root{--k:#11100f;--i:#f1eadf;--g:#b89d75}html{background:#0d0c0b;scroll-behavior:smooth}body{margin:0;background:var(--k);color:#f5f0e8;font-family:Georgia,"Yu Mincho",serif;overflow-x:hidden}a{color:inherit;text-decoration:none}img{display:block;width:100%;height:100%;object-fit:cover}.r{display:none;max-width:1200px;margin:auto;overflow:hidden}.r.on{display:block}header{position:absolute;z-index:5;inset:0 0 auto;display:flex;justify-content:space-between;padding:20px 4vw;align-items:center}.logo{letter-spacing:.28em;font-size:24px}nav{display:flex;gap:22px;font:10px Arial;letter-spacing:.14em}.hm{display:none;font-size:22px}.hero{height:720px;position:relative;overflow:hidden}.hero>img,.ph>img{filter:brightness(.72) saturate(.82)}.hero:after,.ph:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,8,7,.08),transparent 45%,rgba(10,8,7,.5))}.hc,.pt{position:absolute;z-index:2;left:5vw;top:24%;max-width:420px}h1{font-size:55px;line-height:1.2;font-weight:400;margin:12px 0}h2{font-size:38px;font-weight:400;line-height:1.25;margin:10px 0 22px}p{line-height:1.9}.eye{font:10px Arial;letter-spacing:.25em;color:var(--g)}.wave{position:relative;margin-top:-48px;z-index:3;background:#171514;border-radius:50% 50% 0 0/3% 3% 0 0;padding:80px 4.5vw}.grid3{display:grid;grid-template-columns:.8fr 1.4fr .6fr;gap:0}.photo{min-height:420px;clip-path:polygon(5% 0,100% 7%,95% 100%,0 92%)}.quote{background:var(--i);color:#2c231c;padding:60px 25px;text-align:center;clip-path:polygon(0 8%,100% 0,94% 93%,6% 100%)}.iv{background:var(--i);color:#2b221b;padding:80px 4.5vw}.row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}.card{height:300px;position:relative;overflow:hidden}.card:nth-child(2){height:235px;transform:translateY(35px)}.card:nth-child(3){height:265px}.card:nth-child(4){height:220px;transform:translateY(55px)}.card b{position:absolute;left:12px;bottom:12px;color:white;letter-spacing:.12em}.dark{padding:85px 4.5vw;background:#111}.two{display:grid;grid-template-columns:1fr 1fr;gap:42px;align-items:center}.list{border-top:1px solid #594e42}.ln{display:grid;grid-template-columns:100px 1fr auto;gap:12px;padding:15px 0;border-bottom:1px solid #3d352e}.staff{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.person{background:#ded3c4;color:#2b221b}.person img{height:260px}.person div{padding:18px}.band{display:grid;grid-template-columns:1.3fr .7fr;min-height:430px}.band .copy{padding:60px 4vw}.reserve{padding:50px 4.5vw;background:linear-gradient(90deg,#ddd2c3,#f5efe5);color:#221b15;display:flex;justify-content:space-between;align-items:center}.btn{display:inline-block;border:1px solid;padding:13px 22px;font:10px Arial;letter-spacing:.16em}.ph{height:600px;position:relative;overflow:hidden}.pt h1{font-size:60px}.dg{display:grid;grid-template-columns:1fr 1fr}.dg>div{min-height:350px}.cp{padding:60px 5vw}.back{position:fixed;z-index:20;left:12px;bottom:12px;background:#111d;border:1px solid #ffffff55;padding:10px 13px;font:10px Arial}.opt{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.box{background:#e8ded0;color:#271f18;padding:22px}.badge{position:fixed;z-index:99;right:8px;bottom:8px;background:#111c;border:1px solid #ffffff44;padding:6px 8px;font:8px Arial}@media(max-width:760px){header{padding:16px}nav{display:none}.hm{display:block}.hero{height:660px}.hc,.pt{left:22px;right:22px;top:28%;max-width:none}h1{font-size:39px}h2{font-size:30px}.wave{padding:65px 20px}.grid3,.two,.band,.dg{grid-template-columns:1fr}.photo{min-height:300px}.quote{margin:-35px 0 0 38%;min-height:160px;padding:40px 14px}.iv,.dark{padding:65px 20px}.row{grid-template-columns:1.25fr .9fr .9fr;overflow:hidden}.card{height:280px}.card:nth-child(2){height:220px}.card:nth-child(3){height:245px}.card:nth-child(4){display:none}.staff{grid-template-columns:1fr}.person{display:grid;grid-template-columns:42% 58%}.person img{height:210px}.band .photo{height:300px}.reserve{display:block}.reserve .btn{margin-top:20px}.ph{height:560px}.pt h1{font-size:42px}.dg>div{min-height:280px}.cp{padding:48px 20px}.ln{grid-template-columns:75px 1fr auto;font-size:12px}}
</style></head><body><div id="app"></div><div class="badge">KING PREVIEW / v18</div><script>
const I={hero:'https://images.unsplash.com/photo-1496747611176-843222e1e57c?auto=format&fit=crop&w=1600&q=82',salon:'https://images.unsplash.com/photo-1560066984-138dadb4c035?auto=format&fit=crop&w=1600&q=82',tools:'https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=1400&q=82',w1:'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=1000&q=82',w2:'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=1000&q=82',m1:'https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=1000&q=82',m2:'https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=1000&q=82'};
const H=()=>`<header><a class="logo" href="#home">ÉLAN</a><nav><a href="#concept">CONCEPT</a><a href="#style">STYLE</a><a href="#menu">MENU</a><a href="#stylist">STYLIST</a><a href="#salon">SALON</a><a href="#reserve">RESERVE</a></nav><div class="hm">☰</div></header>`;
const home=()=>H()+`<section class="hero"><img src="${I.hero}"><div class="hc"><div class="eye">ÉLAN / HAIR SALON</div><h1>髪から、<br>美しい日常を。</h1><p>髪が変わると、日常が少し、特別になる。洗練された技術と空間で、その人らしい美しさを引き出します。</p></div></section><section class="wave grid3"><div><div class="eye">01 / CONCEPT</div><h2>美しさは、<br>日常の中にある。</h2><p>その人らしい美しさを、毎日の中へ。</p><a class="btn" href="#concept">VIEW →</a></div><div class="photo"><img src="${I.salon}"></div><div class="quote">NATURAL<br>×<br>MODE<br>×<br>YOU</div></section><section class="iv"><div class="eye">02 / STYLE</div><h2>その人らしさが、いちばん美しい。</h2><div class="row">${[['w1','NATURAL'],['m2','MODE'],['w2','FEMININE'],['m1','LUXURY']].map(x=>`<div class="card"><img src="${I[x[0]]}"><b>${x[1]}</b></div>`).join('')}</div></section><section class="dark two"><div><div class="eye">03 / MENU & PRICE</div><h2>美しさをつくる、確かな技術。</h2><div class="list">${[['CUT','¥6,600'],['COLOR','¥8,800〜'],['PERM','¥9,900〜'],['TREATMENT','¥4,400〜'],['HEAD SPA','¥4,950〜']].map(x=>`<div class="ln"><b>${x[0]}</b><span></span><span>${x[1]}</span></div>`).join('')}</div><a class="btn" href="#menu">VIEW MENU →</a></div><div class="photo"><img src="${I.tools}"></div></section><section class="iv"><div class="eye">04 / STYLIST</div><h2>髪を通して、その人らしい美しさを。</h2><div class="staff">${[['m1','RYO'],['w1','MISA'],['m2','DAICHI']].map(x=>`<div class="person"><img src="${I[x[0]]}"><div><h3>${x[1]}</h3><p>その人らしさを引き出すスタイルをご提案。</p></div></div>`).join('')}</div></section><section class="band"><div class="photo"><img src="${I.salon}"></div><div class="copy"><div class="eye">05 / SALON</div><h2>上質な空間で、特別な時間を。</h2><a class="btn" href="#salon">ACCESS →</a></div></section><section class="reserve"><div><div class="eye">06 / RESERVE</div><h2>美しい明日への、はじまりに。</h2></div><a class="btn" href="#reserve">WEB予約する →</a></section>`;
const page=(title,no,lead,blocks)=>H()+`<section class="ph"><img src="${I.hero}"><div class="pt"><div class="eye">${no}</div><h1>${title}</h1><p>${lead}</p></div></section>${blocks}<a class="back" href="#home">← TOPへ戻る</a>`;
const routes={
home,
concept:()=>page('CONCEPT','01','髪から、人生は美しくなる。',`<section class="dg iv"><div class="cp"><div class="eye">BRAND STORY</div><h2>ひとりの人生に、そっと寄り添う存在でありたい。</h2><p>髪だけでなく、心まで軽くなるような時間を。</p></div><div class="photo"><img src="${I.salon}"></div></section><section class="dg dark"><div class="photo"><img src="${I.tools}"></div><div class="cp"><div class="eye">OUR PHILOSOPHY</div><h2>美しさは、丁寧な技術と想いから。</h2></div></section>`),
style:()=>page('STYLE','02','髪で、わたしは変わる。',`<section class="iv"><h2>STYLE GALLERY</h2><div class="row">${[['w1','NATURAL'],['m2','MODE'],['w2','FEMININE'],['m1','LUXURY']].map(x=>`<div class="card"><img src="${I[x[0]]}"><b>${x[1]}</b></div>`).join('')}</div></section>`),
menu:()=>page('MENU / PRICE','03','美しさをつくる、確かな技術。',`<section class="iv"><div class="list">${[['CUT','¥6,600'],['COLOR','¥8,800〜'],['PERM','¥9,900〜'],['TREATMENT','¥4,400〜'],['HEAD SPA','¥4,950〜']].map(x=>`<div class="ln"><b>${x[0]}</b><span>税込</span><span>${x[1]}</span></div>`).join('')}</div></section>`),
stylist:()=>page('STYLIST','04','髪を通して、その人らしい美しさを。',`<section class="iv"><div class="staff">${[['m1','RYO'],['w1','MISA'],['m2','DAICHI']].map(x=>`<div class="person"><img src="${I[x[0]]}"><div><h3>${x[1]}</h3><p>得意分野と個性を活かしたデザインをご提案。</p><a class="btn" href="#reserve">指名予約 →</a></div></div>`).join('')}</div></section>`),
salon:()=>page('SALON / ACCESS','05','美しさが、日常に溶ける場所。',`<section class="dg iv"><div class="photo"><img src="${I.salon}"></div><div class="cp"><h2>五感が満たされる、上質な空間。</h2><p>福岡市中央区白金1丁目12-34<br>10:00–20:00 / 毎週月曜・第3火曜</p><div class="btn">Google Map →</div></div></section>`),
reserve:()=>page('RESERVE','06','美しい明日を、ここから予約する。',`<section class="iv"><h2>ご予約方法</h2><div class="opt"><div class="box"><h3>WEB予約</h3><p>24時間受付</p></div><div class="box"><h3>電話予約</h3><p>092-123-4567</p></div><div class="box"><h3>LINE予約</h3><p>トークから予約</p></div><div class="box"><h3>Instagram DM</h3><p>スタイル相談もOK</p></div></div></section>`)
};
function draw(){let k=(location.hash||'#home').slice(1);if(!routes[k])k='home';app.innerHTML=`<main class="r on">${routes[k]()}</main>`;scrollTo(0,0)}addEventListener('hashchange',draw);draw();
</script></body></html>
