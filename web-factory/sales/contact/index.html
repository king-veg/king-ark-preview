<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>無料相談フォーム — WEB FACTORY</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="form.css"></head><body><a class="preview-back" href="../../../">← ARK PREVIEW</a><header><b>WEB FACTORY</b><a href="../">← 戻る</a></header><main><section class="form-hero"><small>FREE CONSULTATION</small><h1>まずは、<br>店のことから。</h1><p>分からない項目は空欄で大丈夫です。送信時点では契約・発注は成立しません。</p></section><section class="form-wrap"><form id="wf-intake" novalidate><label>お店・事業名 <em>必須</em><input name="business_name" required maxlength="100" autocomplete="organization"></label><label>ご担当者名 <em>必須</em><input name="contact_name" required maxlength="80" autocomplete="name"></label><label>返信先メールアドレス <em>必須</em><input type="email" name="reply_email" required maxlength="160" autocomplete="email"></label><label>業種 <em>必須</em><input name="category" required maxlength="80" placeholder="例：カフェ、美容室"></label><label>現在のホームページURL<input type="url" name="website" maxlength="300" placeholder="https://"></label><label>Instagram / SNS<input type="url" name="social" maxlength="300" placeholder="https://"></label><label>希望プラン<select name="plan"><option value="undecided">まだ決めていない</option><option value="template">TEMPLATE FILL — ¥98,000（税込）</option><option value="custom">CUSTOM — ¥248,000（税込）〜</option></select></label><label>ホームページで実現したいこと <em>必須</em><textarea name="goal" required maxlength="1200" rows="6" placeholder="例：新規のお客様にメニューや雰囲気を伝えたい"></textarea></label><label>希望時期<input name="timing" maxlength="80" placeholder="例：11月頃 / 急ぎではない"></label><label>その他・ご質問<textarea name="notes" maxlength="1200" rows="5"></textarea></label><label class="consent"><input type="checkbox" name="privacy" required> 問い合わせへの回答・見積作成のために入力情報を利用することに同意します。 <em>必須</em></label><button type="submit" disabled>送信 — 接続準備中</button><p id="form-status" class="note" role="status">現在は確認用フォームです。送信先の接続後に受付を開始します。</p></form><aside><small>LINE</small><h2>LINEで<br>気軽に相談。</h2><p>「何を載せればいいか分からない」という段階でもOK。公式LINE開設後、ここから友だち追加できるようになります。</p><button type="button" disabled>LINE公式 — 準備中</button></aside></section></main><footer>WEB FACTORY / PRE-LAUNCH INTAKE</footer><script src="form.js"></script></body></html>
