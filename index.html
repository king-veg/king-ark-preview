<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Artist — 彫夢 / HORIYUME</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505}
#site{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#050505}
</style>
</head>
<body>
<iframe id="site" src="site.html" title="Artist — 彫夢 / HORIYUME"></iframe>
<script src="map-sync.js"></script>
<script src="horiyume-runtime.js"></script>
<script>
const frame=document.getElementById('site');
let applying=false;
async function applyPublished(){
  if(applying)return;applying=true;
  try{
    const cfg=await HoriyumeRuntime.fetchPublished();
    HoriyumeRuntime.applyToFrame(frame,cfg);
    if(window.HoriyumeStore)HoriyumeStore.applyToFrame(frame);
  }finally{applying=false}
}
frame.addEventListener('load',applyPublished);
window.addEventListener('focus',applyPublished);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')applyPublished()});
</script>
</body>
</html>
