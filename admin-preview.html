<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HORIYUME ADMIN</title>
<style>
:root{--gold:#c79a4b;--red:#b7181d}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;overflow:hidden}#site{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050505}.adminbar{position:fixed;z-index:10000;top:6px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:4px 5px;background:rgba(4,4,4,.9);backdrop-filter:blur(12px);border:1px solid rgba(199,154,75,.34);border-radius:999px;box-shadow:0 8px 30px rgba(0,0,0,.4);max-width:calc(100vw - 12px);overflow-x:auto;scrollbar-width:none}.adminbar::-webkit-scrollbar{display:none}.room,.btn{appearance:none;border:0;white-space:nowrap;border-radius:999px;padding:7px 9px;font-weight:800;font-size:10px;cursor:pointer}.room{background:transparent;color:#bdbdbd}.room.on{background:#fff;color:#111}.sep{width:1px;height:24px;background:rgba(255,255,255,.12);flex:0 0 auto}.btn{background:#161616;color:#fff;border:1px solid rgba(255,255,255,.15)}.btn.edit.on{background:var(--red);border-color:var(--red)}.btn.pub{background:linear-gradient(#d9ae62,#9e6f26);color:#160f08;border-color:#e8c681}.btn:disabled,.action:disabled{opacity:.5;cursor:wait}.tip{position:fixed;z-index:10001;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(0,0,0,.86);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 12px;font-size:11px;color:#eee;display:none;pointer-events:none}.tip.show{display:block}.action{position:fixed;z-index:10001;left:10px;border:1px solid rgba(183,24,29,.7);background:rgba(183,24,29,.92);color:#fff;border-radius:999px;padding:8px 11px;font-size:11px;font-weight:800;display:none}.action.show{display:block}#bgBtn{top:54px}#galleryAddBtn{top:54px}#galleryManageBtn{top:94px}#bookingMailBtn{top:54px}#inquiryBtn{top:94px;background:rgba(199,154,75,.95);border-color:#e7c987;color:#17100a}.modalback{position:fixed;z-index:10002;inset:0;background:rgba(0,0,0,.42);display:none;align-items:flex-end;justify-content:center;padding:12px}.modalback.open{display:flex}.editor,.managebox{width:min(620px,96vw);max-height:82vh;overflow:auto;background:rgba(8,8,8,.98);border:1px solid rgba(199,154,75,.4);border-radius:16px;padding:12px;box-shadow:0 18px 55px rgba(0,0,0,.6)}.editorhead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}.editorhead strong{font-size:13px}.close{border:0;background:#202020;color:#fff;border-radius:999px;width:30px;height:30px;font-size:16px}.editor textarea{width:100%;min-height:72px;max-height:32vh;resize:none;background:#111;color:#fff;border:1px solid #343434;border-radius:10px;padding:10px;font-size:14px;line-height:1.5}.editrow{display:flex;gap:8px;margin-top:8px}.editrow button{flex:1;border:0;border-radius:10px;padding:10px;font-weight:800}.cancel{background:#222;color:#fff}.apply{background:#fff;color:#111}.manageitem{display:grid;grid-template-columns:72px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid #242424}.manageitem img{width:72px;height:58px;object-fit:cover;border-radius:8px}.manageitem small{color:#aaa}.manageactions{display:flex;gap:4px}.manageactions button{border:1px solid #333;background:#171717;color:#fff;border-radius:7px;padding:7px 8px}.inquiry{padding:11px 0;border-bottom:1px solid #242424}.inquiry time{display:block;color:#bfa36f;font-size:11px;margin-bottom:5px}.inquiry p{margin:3px 0;font-size:12px;line-height:1.55;word-break:break-word}.empty{color:#aaa;text-align:center;padding:30px 10px}.lock{position:fixed;z-index:20000;inset:0;background:radial-gradient(circle at 50% 20%,#1d1710,#050505 55%);display:grid;place-items:center;padding:20px}.lock.hide{display:none}.lockbox{width:min(420px,94vw);padding:26px;border:1px solid rgba(199,154,75,.45);background:rgba(5,5,5,.96);border-radius:20px;text-align:center}.lockbox h1{font-size:22px;margin:0 0 8px}.lockbox p{color:#bbb;font-size:13px;line-height:1.7}.lockbox input{width:100%;padding:14px;background:#111;border:1px solid #333;border-radius:10px;color:#fff;font-size:20px;text-align:center;letter-spacing:.35em}.lockbox button{margin-top:12px;width:100%;padding:12px;border:0;border-radius:10px;background:#fff;font-weight:900}.lockmsg{min-height:20px;color:#f4b0b0;font-size:12px;margin-top:8px}@media(max-width:900px){.adminbar{left:7px;right:7px;transform:none;max-width:none}.room,.btn{font-size:10px;padding:7px 8px}.modalback{align-items:flex-end;padding:8px}.editor,.managebox{width:min(620px,96vw);padding:10px}.editor textarea{min-height:58px;max-height:28vh}.manageitem{grid-template-columns:58px 1fr auto}.manageitem img{width:58px;height:50px}}
</style>
</head>
<body>
<iframe id="site" src="site.html" title="HORIYUME editable site"></iframe>
<div class="adminbar"><button class="room on" data-room="top">HOME</button><button class="room" data-room="price">PRICE</button><button class="room" data-room="voice">VOICE</button><button class="room" data-room="gallery">GALLERY</button><button class="room" data-room="sns">SNS</button><button class="room" data-room="map">MAP</button><button class="room" data-room="booking">BOOKING</button><span class="sep"></span><button class="btn edit" id="editBtn">編集</button><button class="btn" id="previewBtn">プレビュー</button><button class="btn" id="passBtn">PASS変更</button><button class="btn pub" id="publishBtn">公開</button></div>
<button class="action" id="bgBtn">背景を変更</button><button class="action" id="galleryAddBtn">＋写真追加</button><button class="action" id="galleryManageBtn">写真管理</button><button class="action" id="bookingMailBtn">予備メール設定</button><button class="action" id="inquiryBtn">問い合わせ確認</button>
<input id="imagePicker" type="file" accept="image/*" hidden><input id="bgPicker" type="file" accept="image/*" hidden><input id="galleryPicker" type="file" accept="image/*" hidden><div class="tip" id="tip">編集したい文字・画像をタップ</div>
<div class="modalback" id="modal"><div class="editor"><div class="editorhead"><strong id="editorTitle">文字を編集</strong><button class="close" id="closeEditor">×</button></div><textarea id="textEditor"></textarea><div class="editrow"><button class="cancel" id="cancelEdit">キャンセル</button><button class="apply" id="applyEdit">反映</button></div></div></div>
<div class="modalback" id="manageModal"><div class="managebox"><div class="editorhead"><strong id="manageTitle">写真管理</strong><button class="close" id="closeManage">×</button></div><div id="manageBody"></div></div></div>
<div class="modalback" id="inquiryModal"><div class="managebox"><div class="editorhead"><strong>問い合わせ一覧</strong><button class="close" id="closeInquiry">×</button></div><div id="inquiryBody"></div></div></div>
<div class="lock" id="lock"><div class="lockbox"><h1>HORIYUME ADMIN</h1><p id="lockText">サーバー確認中…</p><input id="passInput" maxlength="4" autocomplete="off" inputmode="text" placeholder="••••"><button id="unlockBtn" disabled>確認中…</button><div class="lockmsg" id="lockMsg"></div></div></div>
<script src="map-sync.js"></script><script src="horiyume-runtime.js"></script>
<script>
const frame=document.getElementById('site'),editBtn=document.getElementById('editBtn'),tip=document.getElementById('tip'),modal=document.getElementById('modal'),textEditor=document.getElementById('textEditor'),imagePicker=document.getElementById('imagePicker'),bgPicker=document.getElementById('bgPicker'),galleryPicker=document.getElementById('galleryPicker'),bgBtn=document.getElementById('bgBtn'),galleryAddBtn=document.getElementById('galleryAddBtn'),galleryManageBtn=document.getElementById('galleryManageBtn'),bookingMailBtn=document.getElementById('bookingMailBtn'),inquiryBtn=document.getElementById('inquiryBtn'),manageModal=document.getElementById('manageModal'),inquiryModal=document.getElementById('inquiryModal');
let editMode=false,currentRoom='top',selectedText=null,pendingImage=null,docBound=false,adminPin='',configured=null,busy=false;
function d(){return frame.contentDocument}function cfg(){return HoriyumeRuntime.draft()}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function applyDraft(){HoriyumeRuntime.applyToFrame(frame,cfg());if(window.HoriyumeStore)HoriyumeStore.applyToFrame(frame)}
function setBusy(v){busy=v;document.getElementById('publishBtn').disabled=v;document.getElementById('passBtn').disabled=v}
async function persist(next){HoriyumeRuntime.saveDraft(next);applyDraft();try{setBusy(true);return await HoriyumeRuntime.saveDraftRemote(next,adminPin)}catch(e){alert('保存できませんでした。通信状態を確認してください。');throw e}finally{setBusy(false)}}
function refreshActions(){bgBtn.classList.toggle('show',editMode&&currentRoom==='top');galleryAddBtn.classList.toggle('show',editMode&&currentRoom==='gallery');galleryManageBtn.classList.toggle('show',editMode&&currentRoom==='gallery');bookingMailBtn.classList.toggle('show',editMode&&currentRoom==='booking');inquiryBtn.classList.toggle('show',currentRoom==='booking')}
function scope(){return HoriyumeRuntime.roomRoot(d(),currentRoom)}
function gotoRoom(room){currentRoom=room;document.querySelectorAll('.room').forEach(b=>b.classList.toggle('on',b.dataset.room===room));const x=d();if(x){const r=x.getElementById('nav-'+room);if(r){r.checked=true;r.dispatchEvent(new Event('change',{bubbles:true}))}}applyDraft();refreshActions();if(editMode)setTimeout(markTargets,30);else clearTargets()}
function clearTargets(){const x=d();if(!x)return;x.querySelectorAll('[data-admin-target]').forEach(el=>{el.removeAttribute('data-admin-target');el.style.outline='';el.style.outlineOffset='';el.style.cursor=''})}
function markTargets(){clearTargets();const x=d(),s=scope();if(!x||!s)return;HoriyumeRuntime.assignKeys(x);HoriyumeRuntime.textTargets(s).forEach(el=>{el.dataset.adminTarget='text';el.style.outline='1px dashed rgba(199,154,75,.72)';el.style.outlineOffset='3px';el.style.cursor='pointer'});HoriyumeRuntime.imageTargets(s).forEach(el=>{el.dataset.adminTarget='image';el.style.outline='2px dashed rgba(183,24,29,.82)';el.style.outlineOffset='3px';el.style.cursor='pointer'})}
function handleTarget(e){if(!editMode)return;const el=e.target;if(!el||!el.dataset.adminTarget)return;e.preventDefault();e.stopPropagation();if(el.dataset.adminTarget==='image'){pendingImage=el;imagePicker.click();return}selectedText=el;textEditor.value=el.innerText||el.textContent||'';document.getElementById('editorTitle').textContent='文字を編集';modal.classList.add('open');setTimeout(()=>textEditor.focus(),30)}
function closeEditor(){modal.classList.remove('open');selectedText=null}
function captureMap(next){const x=d(),clean=id=>String(x.getElementById(id)?.innerText||'').trim().replace(/^(住所|営業時間|定休日)未登録$/,'');const address=clean('addressText');next.storeSettings={address,businessHours:clean('hoursText'),holiday:clean('holidayText'),mapQuery:address};return next}
function loadImage(file){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
async function compress(file,max=1600,quality=.8){const img=await loadImage(file);let w=img.width,h=img.height;if(Math.max(w,h)>max){const s=max/Math.max(w,h);w=Math.round(w*s);h=Math.round(h*s)}let q=quality,data='';for(let n=0;n<10;n++){const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);data=c.toDataURL('image/jpeg',q);const bytes=Math.ceil((data.length-data.indexOf(',')-1)*.75);if(bytes<820000)return data;if(q>.48)q-=.08;else{w=Math.max(640,Math.round(w*.84));h=Math.max(640,Math.round(h*.84))}}return data}
async function upload(file,max,quality){const data=await compress(file,max,quality);const r=await HoriyumeRuntime.uploadImage(data,adminPin);return r.url}
function normalizeGalleryItem(item){return typeof item==='string'?{src:item,uploadedAt:''}:Object.assign({src:'',uploadedAt:''},item||{})}
function renderGalleryManager(){const body=document.getElementById('manageBody'),items=(cfg().galleryExtraImages||[]).map(normalizeGalleryItem);if(!items.length){body.innerHTML='<div class="empty">追加した写真はまだありません。</div>';return}body.innerHTML=items.map((it,i)=>`<div class="manageitem"><img src="${esc(it.src)}" alt=""><div><b>追加写真 ${i+1}</b><br><small>${it.uploadedAt?esc(new Date(it.uploadedAt).toLocaleString('ja-JP')):'日付なし'}</small></div><div class="manageactions"><button data-act="up" data-i="${i}">↑</button><button data-act="down" data-i="${i}">↓</button><button data-act="del" data-i="${i}">×</button></div></div>`).join('')}
async function galleryAction(act,i){const next=cfg(),arr=(next.galleryExtraImages||[]).map(normalizeGalleryItem);if(act==='del'){if(!confirm('この写真を削除しますか？'))return;arr.splice(i,1)}else if(act==='up'&&i>0){[arr[i-1],arr[i]]=[arr[i],arr[i-1]]}else if(act==='down'&&i<arr.length-1){[arr[i+1],arr[i]]=[arr[i],arr[i+1]]}next.galleryExtraImages=arr;await persist(next);renderGalleryManager();if(editMode)markTargets()}
document.getElementById('manageBody').addEventListener('click',e=>{const b=e.target.closest('button[data-act]');if(b)galleryAction(b.dataset.act,Number(b.dataset.i))});
async function showInquiries(){inquiryModal.classList.add('open');const body=document.getElementById('inquiryBody');body.innerHTML='<div class="empty">読み込み中…</div>';try{const items=await HoriyumeRuntime.listInquiries(adminPin);if(!items.length){body.innerHTML='<div class="empty">問い合わせはまだありません。</div>';return}body.innerHTML=items.map(it=>{const f=it.payload?.fields||{};const rows=Object.entries(f).filter(([,v])=>String(v||'').trim()).map(([k,v])=>`<p><b>${esc(k)}</b>：${esc(v)}</p>`).join('');return `<div class="inquiry"><time>${esc(new Date(it.createdAt).toLocaleString('ja-JP'))}</time>${rows||'<p>内容なし</p>'}</div>`}).join('')}catch(e){body.innerHTML='<div class="empty">読み込みに失敗しました。</div>'}}
document.querySelectorAll('.room').forEach(b=>b.onclick=()=>gotoRoom(b.dataset.room));editBtn.onclick=()=>{editMode=!editMode;editBtn.classList.toggle('on',editMode);tip.classList.toggle('show',editMode);refreshActions();if(editMode)markTargets();else clearTargets()};document.getElementById('previewBtn').onclick=()=>{editMode=false;editBtn.classList.remove('on');tip.classList.remove('show');clearTargets();refreshActions();closeEditor();applyDraft()};document.getElementById('closeEditor').onclick=closeEditor;document.getElementById('cancelEdit').onclick=closeEditor;document.getElementById('closeManage').onclick=()=>manageModal.classList.remove('open');document.getElementById('closeInquiry').onclick=()=>inquiryModal.classList.remove('open');
document.getElementById('applyEdit').onclick=async()=>{if(!selectedText||busy)return;const key=selectedText.dataset.horiyumeKey;if(!key)return;const next=cfg();next.textEdits[key]=textEditor.value;selectedText.innerHTML=esc(textEditor.value).replace(/\n/g,'<br>');if(currentRoom==='map')captureMap(next);await persist(next);closeEditor();applyDraft();if(editMode)markTargets()};
imagePicker.onchange=async()=>{const f=imagePicker.files&&imagePicker.files[0];if(!f||!pendingImage)return;try{setBusy(true);const url=await upload(f,1600,.8),key=pendingImage.dataset.horiyumeKey,next=cfg();if(key)next.imageEdits[key]=url;pendingImage=null;imagePicker.value='';await HoriyumeRuntime.saveDraftRemote(next,adminPin);applyDraft();if(editMode)markTargets()}catch(e){alert('画像を保存できませんでした。')}finally{setBusy(false)}};
bgBtn.onclick=()=>bgPicker.click();bgPicker.onchange=async()=>{const f=bgPicker.files&&bgPicker.files[0];if(!f)return;try{setBusy(true);const next=cfg();next.background=await upload(f,2000,.82);bgPicker.value='';await HoriyumeRuntime.saveDraftRemote(next,adminPin);applyDraft()}catch(e){alert('背景画像を保存できませんでした。')}finally{setBusy(false)}};
galleryAddBtn.onclick=()=>galleryPicker.click();galleryPicker.onchange=async()=>{const f=galleryPicker.files&&galleryPicker.files[0];if(!f)return;try{setBusy(true);const next=cfg();next.galleryExtraImages=(next.galleryExtraImages||[]).map(normalizeGalleryItem);next.galleryExtraImages.push({src:await upload(f,1600,.8),uploadedAt:new Date().toISOString()});galleryPicker.value='';await HoriyumeRuntime.saveDraftRemote(next,adminPin);applyDraft();if(editMode)markTargets()}catch(e){alert('写真を追加できませんでした。')}finally{setBusy(false)}};
galleryManageBtn.onclick=()=>{renderGalleryManager();manageModal.classList.add('open')};bookingMailBtn.onclick=async()=>{const next=cfg(),v=prompt('通信エラー時に表示する予備メールアドレス',next.bookingEmail||'');if(v===null)return;next.bookingEmail=String(v).trim();await persist(next)};inquiryBtn.onclick=showInquiries;
document.getElementById('publishBtn').onclick=async()=>{if(busy)return;try{setBusy(true);let next=cfg();if(currentRoom==='map')next=captureMap(next);HoriyumeRuntime.saveDraft(next);await HoriyumeRuntime.publishRemote(next,adminPin);applyDraft();alert('公開しました。別の端末にも同じ内容が反映されます。')}catch(e){alert('公開できませんでした。通信状態を確認してください。')}finally{setBusy(false)}};
document.getElementById('passBtn').onclick=async()=>{if(busy)return;const old=prompt('現在の4文字パスワード',adminPin);if(old===null)return;const np=prompt('新しい4文字パスワード');if(np===null)return;try{setBusy(true);await HoriyumeRuntime.changePass(old,np);adminPin=np;alert('パスワードを変更しました。')}catch(e){alert(e.code==='wrong_pin'?'現在のパスワードが違います':'変更できませんでした。4文字で設定してください。')}finally{setBusy(false)}};
frame.addEventListener('load',()=>{const x=d();if(x&&!docBound){x.addEventListener('click',handleTarget,true);docBound=true}applyDraft();gotoRoom('top')});
const lock=document.getElementById('lock'),passInput=document.getElementById('passInput'),unlockBtn=document.getElementById('unlockBtn'),lockText=document.getElementById('lockText'),lockMsg=document.getElementById('lockMsg');
function lockError(e){if(e.code==='temporarily_locked')return '入力回数が多いため10分間ロックされています。';if(e.code==='wrong_pin')return 'パスワードが違います。';return 'サーバーへ接続できません。時間をおいて再度お試しください。'}
function renderLock(){const setup=configured===false;lockText.textContent=setup?'初回設定です。4文字のパスワードを登録してください。':'4文字パスワードを入力してください。';unlockBtn.textContent=setup?'パスワードを登録':'管理画面を開く';unlockBtn.disabled=false}
async function unlockWith(pin,isSetup){if(isSetup){const seed=cfg();await HoriyumeRuntime.setupPass(pin);adminPin=pin;await HoriyumeRuntime.saveDraftRemote(seed,pin);await HoriyumeRuntime.publishRemote(seed,pin)}else{await HoriyumeRuntime.login(pin);adminPin=pin;await HoriyumeRuntime.loadDraftRemote(pin)}lock.classList.add('hide');applyDraft();gotoRoom('top')}
async function initLock(){try{const s=await HoriyumeRuntime.adminStatus();configured=!!s.configured;renderLock();const saved=HoriyumeRuntime.sessionPin();if(configured&&saved){try{await unlockWith(saved,false)}catch(e){HoriyumeRuntime.clearSessionPin()}}}catch(e){lockText.textContent='保存サーバーへ接続できません';unlockBtn.textContent='再接続';unlockBtn.disabled=false;unlockBtn.dataset.retry='1'}}
unlockBtn.onclick=async()=>{lockMsg.textContent='';if(unlockBtn.dataset.retry==='1'){unlockBtn.disabled=true;unlockBtn.dataset.retry='';await initLock();return}const p=passInput.value;if(Array.from(p).length!==4){lockMsg.textContent='4文字で入力してください。';return}try{unlockBtn.disabled=true;await unlockWith(p,configured===false)}catch(e){lockMsg.textContent=lockError(e)}finally{unlockBtn.disabled=false}};passInput.addEventListener('keydown',e=>{if(e.key==='Enter')unlockBtn.click()});initLock();
</script>
</body>
</html>
