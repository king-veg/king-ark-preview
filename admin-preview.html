<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KOKURYU ADMIN PREVIEW</title>
<style>
:root{--gold:#c79a4b;--red:#b7181d;--panel:rgba(7,7,7,.92)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#050505;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;overflow:hidden}
#site{position:fixed;inset:0;width:100%;height:100%;border:0;background:#050505}
.adminbar{position:fixed;z-index:10000;top:10px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;background:rgba(5,5,5,.88);backdrop-filter:blur(12px);border:1px solid rgba(199,154,75,.38);border-radius:999px;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.brand{padding:0 10px;font-size:11px;letter-spacing:.16em;color:#d9bd87;white-space:nowrap}
.room{appearance:none;border:0;background:transparent;color:#bbb;padding:8px 10px;border-radius:999px;font-weight:700;font-size:11px;cursor:pointer}
.room.on{background:#fff;color:#111}
.actions{display:flex;gap:6px;margin-left:4px;padding-left:8px;border-left:1px solid rgba(255,255,255,.12)}
.btn{border:1px solid rgba(255,255,255,.18);background:#171717;color:#fff;padding:8px 11px;border-radius:999px;font-weight:700;font-size:11px;cursor:pointer}
.btn.edit.on{background:var(--red);border-color:var(--red)}
.btn.pub{background:linear-gradient(#d8ad62,#a9772a);color:#17100a;border-color:#e9c983}
.drawer{position:fixed;z-index:10001;right:12px;top:64px;width:min(340px,calc(100vw - 24px));max-height:calc(100vh - 78px);overflow:auto;background:var(--panel);border:1px solid rgba(199,154,75,.35);border-radius:16px;padding:14px;box-shadow:0 20px 60px rgba(0,0,0,.55);display:none}
.drawer.open{display:block}
.drawer h2{font-size:15px;margin:0 0 6px}
.drawer p{font-size:12px;color:#aaa;line-height:1.6;margin:0 0 12px}
.field{margin:10px 0}
.field label{display:block;font-size:11px;color:#d7bd8a;margin-bottom:6px}
.field input,.field textarea{width:100%;border:1px solid #333;background:#111;color:#fff;border-radius:10px;padding:10px;font-size:13px}
.field textarea{min-height:76px;resize:vertical}
.note{font-size:11px;color:#8f8f8f;padding:10px;border:1px dashed #383838;border-radius:10px}
.save{width:100%;margin-top:12px;border:0;border-radius:10px;padding:11px;background:#fff;color:#111;font-weight:800;cursor:pointer}
.tip{position:fixed;z-index:10002;left:12px;bottom:12px;background:rgba(0,0,0,.82);border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:9px 11px;font-size:11px;color:#ddd;display:none}
.tip.show{display:block}
@media(max-width:900px){.adminbar{left:8px;right:8px;transform:none;overflow-x:auto;justify-content:flex-start}.brand{display:none}.room,.btn{flex:0 0 auto}.drawer{top:58px}}
</style>
</head>
<body>
<iframe id="site" src="site.html" title="KOKURYU editable site"></iframe>

<div class="adminbar" aria-label="KOKURYU 管理">
  <div class="brand">KOKURYU ADMIN</div>
  <button class="room on" data-room="top">HOME</button>
  <button class="room" data-room="price">PRICE</button>
  <button class="room" data-room="voice">VOICE</button>
  <button class="room" data-room="gallery">GALLERY</button>
  <button class="room" data-room="sns">SNS</button>
  <button class="room" data-room="map">MAP</button>
  <button class="room" data-room="booking">BOOKING</button>
  <div class="actions">
    <button class="btn edit" id="editBtn">編集</button>
    <button class="btn" id="previewBtn">プレビュー</button>
    <button class="btn pub" id="publishBtn">公開</button>
  </div>
</div>

<aside class="drawer" id="drawer">
  <h2 id="drawerTitle">HOME 編集</h2>
  <p id="drawerDesc">今の公開画面をそのまま編集します。</p>
  <div id="homeFields">
    <div class="field"><label>左側 見出し</label><input id="leadInput" value="彫りの世界観を、肌に刻む。"></div>
    <div class="field"><label>左側 サブコピー</label><textarea id="copyInput">伝統と現代が交わる、
唯一無二の和彫りを。</textarea></div>
    <div class="field"><label>トップ背景</label><input id="bgInput" type="file" accept="image/*"></div>
    <div class="note">人物は後で実際の彫り師写真を受け取った時に、独立レイヤーとしてここへ追加する設計。</div>
  </div>
  <div id="genericFields" style="display:none">
    <div class="note">この部屋は、表示中のページそのものを編集対象にする。編集モード中は文章をタップして直接編集、画像をタップして画像差し替え。</div>
  </div>
  <button class="save" id="saveBtn">下書きを保存</button>
</aside>

<input id="imagePicker" type="file" accept="image/*" hidden>
<div class="tip" id="tip">編集モード：文章または画像を直接タップ</div>

<script>
const frame=document.getElementById("site");
const drawer=document.getElementById("drawer");
const editBtn=document.getElementById("editBtn");
const tip=document.getElementById("tip");
const imagePicker=document.getElementById("imagePicker");
const CURRENT_BG="https://d2jqrm6oza8nb6.cloudfront.net/datasets/a245aeb6-7b47-4216-9456-96b93535f841.png?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiMGI3NWRhNWM3YWRkNzJkMiIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5MDQxMzc4OH0.Z5ZR1AjrehwXqwFQWQNJnesJDXfgIgViNW7CDif_Z7s";
let editMode=false;
let currentRoom="top";
let pendingImage=null;

function doc(){ return frame.contentDocument; }

function applyCurrentPublicLook(){
  const d=doc(); if(!d) return;
  let s=d.getElementById("admin-current-public-bg");
  if(!s){s=d.createElement("style");s.id="admin-current-public-bg";d.head.appendChild(s);}
  const savedBg=localStorage.getItem("kokuryuAdminBg")||CURRENT_BG;
  s.textContent='.bg{background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.34)),url("'+savedBg+'") center top / cover no-repeat !important;}';
  const saved=JSON.parse(localStorage.getItem("kokuryuAdminCopy")||"null");
  if(saved){
    const lead=d.querySelector(".hero-info__lead");
    const copy=d.querySelector(".hero-info__copy");
    if(lead) lead.textContent=saved.lead||"";
    if(copy) copy.innerHTML=(saved.copy||"").split("\n").map(escapeHtml).join("<br>");
    document.getElementById("leadInput").value=saved.lead||"";
    document.getElementById("copyInput").value=saved.copy||"";
  }
}
function escapeHtml(v){return String(v).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

function gotoRoom(room){
  currentRoom=room;
  document.querySelectorAll(".room").forEach(b=>b.classList.toggle("on",b.dataset.room===room));
  const d=doc(); if(!d)return;
  const radio=d.getElementById("nav-"+room);
  if(radio){radio.checked=true;radio.dispatchEvent(new Event("change",{bubbles:true}));}
  document.getElementById("drawerTitle").textContent=room.toUpperCase()+" 編集";
  document.getElementById("homeFields").style.display=room==="top"?"block":"none";
  document.getElementById("genericFields").style.display=room==="top"?"none":"block";
}

function clearEditing(){
  const d=doc(); if(!d)return;
  d.querySelectorAll("[data-admin-editable]").forEach(el=>{
    el.removeAttribute("contenteditable");
    el.removeAttribute("data-admin-editable");
    el.style.outline="";
    el.style.outlineOffset="";
    el.style.cursor="";
  });
}
function enableEditing(){
  const d=doc(); if(!d)return;
  clearEditing();
  const scope=currentRoom==="top"?d.getElementById("page-top"):d.getElementById("page-"+currentRoom);
  if(!scope)return;
  scope.querySelectorAll("h1,h2,h3,p,b,small,span,.value,.label").forEach(el=>{
    if(el.children.length===0){
      el.contentEditable="true";el.dataset.adminEditable="text";
      el.style.outline="1px dashed rgba(199,154,75,.65)";
      el.style.outlineOffset="3px";
    }
  });
  scope.querySelectorAll("img").forEach(img=>{
    img.dataset.adminEditable="image";
    img.style.outline="2px dashed rgba(183,24,29,.75)";
    img.style.outlineOffset="3px";
    img.style.cursor="pointer";
  });
  scope.addEventListener("click",editableClick,true);
}
function editableClick(e){
  if(!editMode)return;
  const el=e.target;
  if(el && el.tagName==="IMG"){
    e.preventDefault();e.stopPropagation();
    pendingImage=el; imagePicker.click();
  }
}
imagePicker.addEventListener("change",()=>{
  const f=imagePicker.files&&imagePicker.files[0]; if(!f||!pendingImage)return;
  const r=new FileReader();r.onload=()=>{pendingImage.src=r.result;pendingImage=null;};r.readAsDataURL(f);
});
document.querySelectorAll(".room").forEach(b=>b.addEventListener("click",()=>{
  gotoRoom(b.dataset.room);
  if(editMode) setTimeout(enableEditing,40);
}));
editBtn.addEventListener("click",()=>{
  editMode=!editMode;
  editBtn.classList.toggle("on",editMode);
  drawer.classList.toggle("open",editMode);
  tip.classList.toggle("show",editMode);
  if(editMode) enableEditing(); else clearEditing();
});
document.getElementById("previewBtn").addEventListener("click",()=>{
  editMode=false;editBtn.classList.remove("on");drawer.classList.remove("open");tip.classList.remove("show");clearEditing();
});
document.getElementById("leadInput").addEventListener("input",e=>{
  const el=doc()?.querySelector(".hero-info__lead"); if(el)el.textContent=e.target.value;
});
document.getElementById("copyInput").addEventListener("input",e=>{
  const el=doc()?.querySelector(".hero-info__copy"); if(el)el.innerHTML=e.target.value.split("\n").map(escapeHtml).join("<br>");
});
document.getElementById("bgInput").addEventListener("change",e=>{
  const f=e.target.files&&e.target.files[0]; if(!f)return;
  const r=new FileReader();r.onload=()=>{
    localStorage.setItem("kokuryuAdminBg",r.result);
    applyCurrentPublicLook();
  };r.readAsDataURL(f);
});
document.getElementById("saveBtn").addEventListener("click",()=>{
  localStorage.setItem("kokuryuAdminCopy",JSON.stringify({
    lead:document.getElementById("leadInput").value,
    copy:document.getElementById("copyInput").value
  }));
  alert("下書きをこの端末に保存しました");
});
document.getElementById("publishBtn").addEventListener("click",()=>{
  alert("公開ボタンは管理バックエンド接続後に本番サイトへ反映する仕様です。現在はプレビュー段階です。");
});

frame.addEventListener("load",()=>{
  applyCurrentPublicLook();
  gotoRoom("top");
});
</script>
</body>
</html>
